[project]
name = "todo-backend"
version = "1.6.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai>=2.46.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "httpx",
    "pyinstaller",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
